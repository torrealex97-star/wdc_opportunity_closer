name: JobSpy collect
# Recolector diario de ofertas en España (Indeed, LinkedIn, Glassdoor, Google Jobs) con JobSpy. Envía BORRADORES al panel.
# Riesgo asumido por el operador (ADR-011): estas webs restringen el scraping en sus condiciones de uso.
# Última vía: si no hay proxies sanos, NO se lanza. El modo directo solo se activa a propósito con JOBSPY_ALLOW_DIRECT=1.
# Secretos del repositorio necesarios: INGEST_URL (https://<dominio>/api/ingest), INGEST_TOKEN e, idealmente, JOBSPY_PROXIES.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sitios separados por coma (indeed,linkedin,glassdoor,google)'
        default: 'indeed,linkedin,glassdoor,google'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Commit fijado de speedyapply/JobSpy (revisado, 2026-10-14): más reciente que PyPI 1.3.0, con informe de errores por sitio.
      - run: python -m pip install "python-jobspy @ git+https://github.com/speedyapply/JobSpy.git@1988484ac76ff9ae57784750346842e967e8ba10"
      - name: Recoger y enviar borradores
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          SITES: ${{ github.event.inputs.sites || 'indeed,linkedin,glassdoor,google' }}
          JOBSPY_PROXIES: ${{ secrets.JOBSPY_PROXIES }}   # obligatorio salvo modo directo explícito
          JOBSPY_ALLOW_DIRECT: '0'                        # cámbialo a 1 solo si asumes el riesgo de bloqueo
        run: |
          set -o pipefail
          python scripts/jobspy_collect.py --sites "$SITES" 2>&1 | tee jobspy.log
      - name: Resumen de proxies (qué falló y por qué)
        if: always()
        run: |
          echo '### JobSpy' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 jobspy.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo 'sin salida' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
