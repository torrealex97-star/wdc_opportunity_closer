name: Boards collect
# Tableros públicos de empresas (Greenhouse, Ashby, SmartRecruiters, Recruitee, Teamtailor) -> borradores en el panel, una fuente por ATS.
# Gratuito, sin proxies. Los contratos de cada API NO están verificados contra el servicio real: la PRIMERA ejecución se lanza a mano con dry_run=1
# y se lee el resumen (tableros ok / con error y las ofertas que cualifican). Secretos: INGEST_URL (https://<dominio>/api/ingest) e INGEST_TOKEN.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo buscar y mostrar, sin enviar (1 = sí)'
        default: '1'
      only:
        description: 'Solo un ATS (greenhouse, ashby, smartrecruiters, recruitee, teamtailor); vacío = todos'
        default: ''
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Recoger y enviar borradores
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          ONLY: ${{ github.event.inputs.only || '' }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "$DRY_RUN" = "1" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          python scripts/boards_collect.py $ARGS 2>&1 | tee boards.log
      - name: Resumen (tableros leídos, con error y ofertas de rol)
        if: always()
        run: |
          echo '### Tableros de empresas' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 boards.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo 'sin salida' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
